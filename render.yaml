# Render Blueprint for SEATWISEE ("DO! u want") — FREE plan, no persistent disk.
# Deploy: Render dashboard -> New + -> Blueprint -> pick this repo -> Apply.
# Note: on the free plan the filesystem is ephemeral. The SQLite DB and uploads/ reset
# whenever the instance restarts or spins down after 15 min idle; demo data re-seeds itself.
services:
  - type: web
    name: seatwisee
    runtime: python
    region: singapore
    plan: free
    branch: master
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: "false"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
